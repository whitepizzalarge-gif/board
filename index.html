<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ボード</title>
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151B23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ボード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=15">
</head>
<body>
<div class="topbar" id="topbar">
  <span class="tb-title">ボード</span>
  <span class="tb-stamp" id="stamp"></span>
  <button class="tb-btn" id="btnRefresh" data-act="reload" aria-label="サイトを更新する">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>更新
  </button>
  <button class="tb-btn plain" data-act="settings">設定</button>
</div>
<div class="ptr" id="ptr">↓ 引いて更新</div>
<main class="wrap" id="app" aria-live="polite"></main>

<button class="fab" id="fab" aria-label="タスクを追加">＋</button>
<div class="toast" id="toast" role="status"></div>

<!-- タスクの追加・編集（共通） -->
<dialog id="taskDlg">
  <form class="sheet" method="dialog" id="taskForm">
    <h3 id="taskTitle">タスクを追加</h3>
    <label class="field"><span>内容</span><textarea name="内容" required></textarea></label>
    <div class="field-row">
      <label class="field"><span>日付</span><input type="date" name="日付"></label>
      <label class="chk"><input type="checkbox" name="nodate"> 日付なし</label>
    </div>
    <div class="bizpick" id="bizPick"></div>
    <label class="field"><span>プロジェクト</span><select name="プロジェクトID"></select></label>
    <div class="field-row">
      <label class="field"><span>状態</span><select name="状態"></select></label>
      <label class="field"><span>期限</span><input type="date" name="期限"></label>
      <label class="field narrow"><span>見込み分</span><input type="number" name="見込み分" inputmode="numeric" min="0" step="5"></label>
    </div>
    <label class="field"><span>メモ</span><textarea name="メモ" class="short"></textarea></label>
    <label class="field"><span>サブタスク（1行に1つ。完了した行は頭に ✓ ）</span><textarea name="サブタスク"></textarea></label>
    <div class="row-btns">
      <button class="btn sec left" value="tomorrow" id="btnTomorrow" formnovalidate>明日へ</button>
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<!-- タスクの中身（一覧では一言にまとめてあるので、ここで全文を見る） -->
<dialog id="taskView">
  <div class="sheet">
    <h3 id="tvTitle">タスクの内容</h3>
    <div id="tvBody"></div>
    <div class="row-btns">
      <button class="btn sec" id="tvClose">閉じる</button>
      <button class="btn pri" id="tvEdit">編集</button>
    </div>
  </div>
</dialog>

<!-- 月カレンダー：全部の月のタスクと予定を簡易表示 -->
<dialog id="monthDlg">
  <div class="sheet">
    <div class="m-head">
      <button class="btn-s" id="mPrev" aria-label="前の月">‹ 前の月</button>
      <h3 id="mTitle"></h3>
      <button class="btn-s" id="mNext" aria-label="次の月">次の月 ›</button>
      <button class="btn-s keep" id="mToday">今日</button>
      <button class="btn-s" id="mClose">閉じる</button>
    </div>
    <div class="m-wd"><span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span></div>
    <div class="m-grid" id="mGrid"></div>
    <div id="mDetail"></div>
  </div>
</dialog>

<!-- 事業の中身：この事業で動いているプロジェクト -->
<dialog id="bizView">
  <div class="sheet">
    <h3 id="bvTitle"></h3>
    <div id="bvBody"></div>
    <div class="row-btns">
      <button class="btn sec left" id="bvAdd">＋ プロジェクトを足す</button>
      <button class="btn pri" id="bvClose">閉じる</button>
    </div>
  </div>
</dialog>

<!-- プロジェクトの追加・編集 -->
<dialog id="projDlg">
  <form class="sheet" method="dialog" id="projForm">
    <h3 id="projTitle">プロジェクトを追加</h3>
    <label class="field"><span>名前</span><input name="名前" required autocomplete="off"></label>
    <div class="bizpick" id="pBizPick"></div>
    <div class="field-row">
      <label class="field"><span>状態</span><select name="状態"><option>進行中</option><option>待ち</option><option>完了</option></select></label>
      <label class="field"><span>期限</span><input type="date" name="期限"></label>
    </div>
    <label class="field"><span>次の一手</span><textarea name="次の一手" class="short"></textarea></label>
    <div class="row-btns">
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<!-- 定期タスク（設定の中） -->
<dialog id="recDlg">
  <div class="sheet">
    <h3>定期タスク</h3>
    <p class="hint">毎日5時に、開始日が7日以内に来る回のタスクを作ります。名前・周期・日付はスプシの「定期」タブで直します。</p>
    <div id="recBody"></div>
    <div class="row-btns"><button class="btn sec" id="recClose">閉じる</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <form class="sheet" method="dialog" id="setForm">
    <h3>接続の設定</h3>
    <p class="hint">GASのウェブアプリURLと、setupで出た合言葉を入れます。この端末にだけ保存されます。URLに demo と入れると見本データで表示します。</p>
    <label class="field"><span>ウェブアプリURL</span><input name="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>合言葉</span><input name="key" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="row-btns">
      <button class="btn sec left" type="button" id="btnRecur">定期タスク</button>
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=15"></script>
</body>
</html>
