<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ボード</title>
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151B23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ボード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --surface:#F7F9FB; --ink:#1C2733; --sub:#5B6775; --line:#D3DAE2; --accent:#2F55C8;
  --b-giga:#2563C9; --b-maru:#B98117; --b-sheep:#8C3B2C; --b-eld:#7A4CCB; --b-poto:#2D8A6C; --b-self:#6B7480;
  --danger:#B23A3A;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151B23; --surface:#1D2530; --ink:#E6EBF1; --sub:#98A3B1; --line:#2E3946; --accent:#7D9BF2;
    --b-giga:#6E9BEA; --b-maru:#DDAA48; --b-sheep:#D17A68; --b-eld:#A887E6; --b-poto:#5DBB98; --b-self:#9AA3AE;
    --danger:#E07272;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:16px; line-height:1.55; font-feature-settings:"palt";
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---- 今日の見出し ---- */
.today{padding:20px 0 18px}
.today-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.date{font-weight:900;font-size:56px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date small{font-size:20px;font-weight:700;margin-left:6px;letter-spacing:0;color:var(--sub)}
.count{font-size:14px;color:var(--sub);text-align:right;line-height:1.3}
.count b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:3px;margin-top:14px;height:10px}
.strip span{flex:1;border-radius:2px;background:var(--c);opacity:.22}
.strip span.done{opacity:1}
.strip.empty span{background:var(--line);opacity:1}

/* ---- セクション ---- */
section{margin-top:28px}
h2{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2 .n{font-weight:500;color:var(--sub);font-size:13px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px 13px 0;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item::before{content:"";align-self:stretch;width:4px;border-radius:0 3px 3px 0;background:var(--c,var(--b-self));flex:none}
.body{flex:1;min-width:0}
.title{word-break:break-word}
.meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.meta .biz{color:var(--c)}
.empty-note{padding:16px;color:var(--sub);font-size:14px;background:var(--surface);border-radius:14px}

/* チェック */
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--sub));background:transparent;margin-top:-1px;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.item.is-done .check{background:var(--c)}
.item.is-done .check svg{opacity:1}
.item.is-done .title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1px}

/* 繰越 */
.carry .acts{display:flex;gap:6px;flex:none}
.btn-s{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px}
.btn-s.keep{border-color:var(--accent);color:var(--accent)}
.btn-s.drop{color:var(--sub)}

/* プロジェクト */
.biz-head{font-size:13px;font-weight:700;color:var(--c);margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.biz-head::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.proj .next{font-size:14px;margin-top:3px}
.proj .next::before{content:"次 ";color:var(--sub);font-size:12px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--sub);margin-left:6px;vertical-align:1px}
.chip.wait{border-color:var(--b-maru);color:var(--b-maru)}
.due-over{color:var(--danger);font-weight:700}

/* 目標 */
.goals{display:grid;gap:10px}
.goal-block{background:var(--surface);border-radius:14px;padding:14px 16px}
.goal-block h3{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:700}
.goal{padding:8px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.goal .gt{font-weight:700}
.goal .gbiz{display:inline-block;font-size:12px;font-weight:700;color:var(--c);border-left:3px solid var(--c);padding-left:6px;margin-bottom:2px}
.goal dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.goal dt{color:var(--sub)}
.goal dd{margin:0}

/* 決定ログ */
.dec .title{font-size:15px}
.dec .why{font-size:13px;color:var(--sub);margin-top:3px;white-space:pre-wrap}
.dec .why::before{content:"理由・却下案 ";font-size:11.5px}
.chip.st-確定{border-color:var(--accent);color:var(--accent)}
.chip.st-保留{border-color:var(--b-maru);color:var(--b-maru)}
.item.is-void .title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1px}
.dec a{color:var(--accent);text-decoration:none}
.more{margin-top:8px}
.more summary{font-size:13px;color:var(--accent);cursor:pointer;padding:6px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more .list{margin-top:6px}

/* 下部 */
.foot{margin-top:28px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--accent);padding:6px 0;font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(20,40,90,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

/* シート */
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,24,.45)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.bizpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bizpick label{position:relative}
.bizpick input{position:absolute;opacity:0}
.bizpick span{display:block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px}
.bizpick input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.bizpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.row-btns{display:flex;gap:8px;justify-content:flex-end}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:transparent;border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--sub);margin:-4px 0 12px}
.err{color:var(--danger);font-size:14px;padding:14px 16px;background:var(--surface);border-radius:14px;margin-top:16px}

/* 追加分 */
.item.ev{padding:10px 14px 10px 0}
.item.ev::before{background:var(--line)}
.ev-time{flex:none;width:44px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .title{font-size:14.5px}
.ev-list{margin-bottom:6px}
.rec{padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .rec-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.rec .rec-h b{font-size:15px}
.rec .rec-h .chk{margin-bottom:0}
.rec .meta{margin:2px 0 8px}
.rec .field{margin-bottom:8px}
.rec .row-btns{justify-content:flex-start}
#recBody{max-height:60vh;overflow:auto}

button.tap{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.item .body.tap{flex:1;min-width:0}
button.item.proj{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;font:inherit;color:inherit}
.list>button.item:first-child{border-top:0}
.day-head{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
h2 .h-act{margin-left:auto;font-size:13px;padding:0}
.chip.wait{border-color:var(--b-maru);color:var(--b-maru)}
.cands summary{font-size:15px;font-weight:700;color:var(--ink)}
.cands summary .n{font-weight:500;color:var(--sub);font-size:13px}
.cand .title{font-size:14px}
.cand{padding-left:14px}
.cand::before{display:none}
.field-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field-row .field{flex:1;min-width:120px}
.field-row .field.narrow{flex:0 0 96px;min-width:0}
.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 10px;font-size:16px}
.field input:disabled{opacity:.45}
.field textarea.short{min-height:52px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:24px;white-space:nowrap}
.row-btns .left{margin-right:auto}
dialog{max-height:92vh;overflow:auto}
.pv-meta{margin:-6px 0 8px}
.pv-next{margin:0 0 12px;font-size:14px}
.pv-h{font-size:13px;color:var(--sub);margin:14px 0 6px}
#pvBody .list{margin-bottom:12px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<button class="fab" id="fab" aria-label="タスクを追加">＋</button>
<div class="toast" id="toast" role="status"></div>

<!-- タスクの追加・編集（共通） -->
<dialog id="taskDlg">
  <form class="sheet" method="dialog" id="taskForm">
    <h3 id="taskTitle">タスクを追加</h3>
    <label class="field"><span>内容</span><textarea name="内容" required></textarea></label>
    <div class="field-row">
      <label class="field"><span>日付</span><input type="date" name="日付"></label>
      <label class="chk"><input type="checkbox" name="nodate"> 日付なし</label>
    </div>
    <div class="bizpick" id="bizPick"></div>
    <label class="field"><span>プロジェクト</span><select name="プロジェクトID"></select></label>
    <div class="field-row">
      <label class="field"><span>状態</span><select name="状態"></select></label>
      <label class="field"><span>期限</span><input type="date" name="期限"></label>
      <label class="field narrow"><span>見込み分</span><input type="number" name="見込み分" inputmode="numeric" min="0" step="5"></label>
    </div>
    <label class="field"><span>メモ</span><textarea name="メモ" class="short"></textarea></label>
    <div class="row-btns">
      <button class="btn sec left" value="tomorrow" id="btnTomorrow" formnovalidate>明日へ</button>
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<!-- プロジェクトの中身 -->
<dialog id="projView">
  <div class="sheet">
    <h3 id="pvTitle"></h3>
    <div id="pvBody"></div>
    <div class="row-btns">
      <button class="btn sec left" id="pvAddTask">タスクを足す</button>
      <button class="btn sec" id="pvClose">閉じる</button>
      <button class="btn pri" id="pvEdit">編集</button>
    </div>
  </div>
</dialog>

<!-- プロジェクトの追加・編集 -->
<dialog id="projDlg">
  <form class="sheet" method="dialog" id="projForm">
    <h3 id="projTitle">プロジェクトを追加</h3>
    <label class="field"><span>名前</span><input name="名前" required autocomplete="off"></label>
    <div class="bizpick" id="pBizPick"></div>
    <div class="field-row">
      <label class="field"><span>状態</span><select name="状態"><option>進行中</option><option>待ち</option><option>完了</option></select></label>
      <label class="field"><span>期限</span><input type="date" name="期限"></label>
    </div>
    <label class="field"><span>次の一手</span><textarea name="次の一手" class="short"></textarea></label>
    <div class="row-btns">
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<!-- 定期タスク（設定の中） -->
<dialog id="recDlg">
  <div class="sheet">
    <h3>定期タスク</h3>
    <p class="hint">毎日5時に、開始日が7日以内に来る回のタスクを作ります。名前・周期・日付はスプシの「定期」タブで直します。</p>
    <div id="recBody"></div>
    <div class="row-btns"><button class="btn sec" id="recClose">閉じる</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <form class="sheet" method="dialog" id="setForm">
    <h3>接続の設定</h3>
    <p class="hint">GASのウェブアプリURLと、setupで出た合言葉を入れます。この端末にだけ保存されます。URLに demo と入れると見本データで表示します。</p>
    <label class="field"><span>ウェブアプリURL</span><input name="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>合言葉</span><input name="key" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="row-btns">
      <button class="btn sec left" type="button" id="btnRecur">定期タスク</button>
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<script>
const BIZ = [
  {name:'ギガネット（通信）', v:'--b-giga'},
  {name:'円山製麺', v:'--b-maru'},
  {name:'SHEEP GANG', v:'--b-sheep'},
  {name:'エルダイブ', v:'--b-eld'},
  {name:'ぽとふ', v:'--b-poto'},
  {name:'個人', v:'--b-self'},
];
const TASK_STATUS = ['未','済','待ち','保留','繰越','捨'];
const bizVar = n => (BIZ.find(b => b.name === n) || {v:'--b-self'}).v;
const bizOrder = n => { const i = BIZ.findIndex(b => b.name === n); return i < 0 ? 99 : i; };
const WD = ['日','月','火','水','木','金','土'];
// yyyy-mm-dd に日数を足す
const addDays = (ymd, n) => { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const md = ymd => { const d = new Date(ymd + 'T00:00:00Z'); return `${d.getUTCMonth()+1}/${d.getUTCDate()}（${WD[d.getUTCDay()]}）`; };
const mdShort = ymd => String(ymd).slice(5).replace('-','/');

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let cfg = store.get('board.cfg', {url:'', key:''});
let state = store.get('board.cache', null);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 通信 ---------- */
async function api(action, params = {}){
  if (cfg.url === 'demo') return demoApi(action, params);
  if (!cfg.url || !cfg.key) throw new Error('not_configured');
  // 合言葉はURLに載せず、すべて本文で送る
  const res = await fetch(cfg.url, {method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, key:cfg.key, ...params})});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.data;
}

async function load(){
  try {
    state = await api('data');
    store.set('board.cache', state);
    render();
  } catch(e){
    render(e);
  }
}

/* ---------- 描画 ---------- */
function render(err){
  const app = $('#app');
  if (!cfg.url){
    app.innerHTML = `<div class="today"><div class="date">ボード</div></div>
      <p class="empty-note">接続先がまだ設定されていません。</p>
      <div class="foot"><span></span><button class="link" data-act="settings">接続を設定する</button></div>`;
    return;
  }
  if (!state){
    app.innerHTML = `<div class="today"><div class="date">…</div></div>` + (err ? errBox(err) : '');
    return;
  }
  const d = new Date(state.today + 'T00:00:00+09:00');
  const tasks = [...state.tasks].sort((a,b) => (a['状態']==='済') - (b['状態']==='済') || bizOrder(a['事業']) - bizOrder(b['事業']));
  const done = tasks.filter(t => t['状態'] === '済').length;
  const strip = tasks.length
    ? tasks.map(t => `<span class="${t['状態']==='済'?'done':''}" style="--c:var(${bizVar(t['事業'])})"></span>`).join('')
    : '<span></span>';
  const waiting = state.waiting || [];
  const cands = state.candidates || [];

  app.innerHTML = `
    <header class="today">
      <div class="today-row">
        <div class="date">${d.getMonth()+1}/${d.getDate()}<small>${WD[d.getDay()]}</small></div>
        <div class="count"><b>${done}/${tasks.length}</b>今日の完了</div>
      </div>
      <div class="strip ${tasks.length?'':'empty'}" aria-hidden="true">${strip}</div>
    </header>
    ${err ? errBox(err) : ''}
    ${state.carry.length ? `
    <section class="carry">
      <h2>前日までの残り <span class="n">${state.carry.length}件 ・ 今日やるか、やめるか</span></h2>
      <div class="list">${state.carry.map(carryItem).join('')}</div>
    </section>` : ''}
    <section>
      <h2>今日やること <span class="n">${tasks.length}件</span></h2>
      ${eventsHtml(state.today)}
      ${tasks.length ? `<div class="list">${tasks.map(t => taskItem(t)).join('')}</div>`
        : `<p class="empty-note">今日のタスクはまだありません。右下の＋か、Claudeに送って追加します。</p>`}
    </section>
    ${upcomingHtml()}
    ${waiting.length ? `
    <section>
      <h2>待ち・保留 <span class="n">${waiting.length}件</span></h2>
      <div class="list">${waiting.map(t => taskItem(t, {showDate:true})).join('')}</div>
    </section>` : ''}
    ${projectsHtml()}
    ${goalsHtml()}
    ${decisionsHtml()}
    ${state.someday && state.someday.length ? `
    <section>
      <h2>日付なし <span class="n">${state.someday.length}件</span></h2>
      <div class="list">${state.someday.map(t => taskItem(t)).join('')}</div>
    </section>` : ''}
    ${cands.length ? `
    <section>
      <details class="more cands">
        <summary>候補 ${cands.length}件 <span class="n">Claudeが拾った未確認のもの</span></summary>
        <div class="list">${cands.map(candItem).join('')}</div>
      </details>
    </section>` : ''}
    <div class="foot">
      <span>${esc(state.fetchedAt)} 時点</span>
      <span><button class="link" data-act="reload">更新</button>　<button class="link" data-act="settings">設定</button></span>
    </div>`;
}

function errBox(e){
  const m = String(e.message || e);
  const msg = m === 'unauthorized' ? '合言葉が一致しません。設定を確認してください。'
    : m === 'not_configured' ? '接続先が未設定です。'
    : /Failed to fetch|NetworkError|Load failed/.test(m) ? '通信できませんでした。前回読み込んだ内容を表示しています。'
    : 'エラー：' + m;
  return `<div class="err" role="alert">${esc(msg)}</div>`;
}

function taskItem(t, opt = {}){
  const isDone = t['状態'] === '済';
  const st = t['状態'] === '待ち' || t['状態'] === '保留' ? `<span class="chip wait">${esc(t['状態'])}</span>` : '';
  const meta = [
    `<span class="biz">${esc(t['事業'] || '事業未設定')}</span>`,
    opt.showDate && t['日付'] ? esc(mdShort(t['日付'])) : '',
    t['期限'] ? `<span class="${t['期限'] < state.today && !isDone ? 'due-over' : ''}">期限 ${esc(mdShort(t['期限']))}</span>` : '',
    t['見込み分'] ? esc(t['見込み分']) + '分' : '',
    t['メモ'] ? esc(t['メモ']) : '',
  ].filter(Boolean).join('　');
  return `<div class="item ${isDone?'is-done':''}" style="--c:var(${bizVar(t['事業'])})">
    <button class="check" data-act="toggle" data-id="${esc(t.ID)}" aria-label="${isDone?'未完了に戻す':'完了にする'}：${esc(t['内容'])}">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
    </button>
    <button class="body tap" data-act="edit" data-id="${esc(t.ID)}">
      <div class="title">${esc(t['内容'])}${st}</div>
      <div class="meta">${meta}</div>
    </button>
  </div>`;
}

function carryItem(t){
  return `<div class="item" style="--c:var(${bizVar(t['事業'])})">
    <button class="body tap" data-act="edit" data-id="${esc(t.ID)}">
      <div class="title">${esc(t['内容'])}</div>
      <div class="meta"><span class="biz">${esc(t['事業'] || '事業未設定')}</span>　${esc(mdShort(t['日付']))}の分</div>
    </button>
    <div class="acts">
      <button class="btn-s keep" data-act="keep" data-id="${esc(t.ID)}">今日やる</button>
      <button class="btn-s drop" data-act="drop" data-id="${esc(t.ID)}">やめる</button>
    </div>

}

function candItem(c){
  return `<div class="item cand">
    <div class="body">
      <div class="title">${esc(c['原文'])}</div>
      <div class="meta">${esc(String(c['日時']).slice(5, 10).replace('-','/'))}</div>
    </div>
    <div class="acts">
      <button class="btn-s keep" data-act="cand-take" data-id="${esc(c['行ID'])}">載せる</button>
      <button class="btn-s drop" data-act="cand-drop" data-id="${esc(c['行ID'])}">不要</button>

// カレンダーの予定（チェック丸なし。終日は時刻の代わりに「終日」）
const eventsOn = day => (state.events || []).filter(e => e.date === day)
  .sort((a,b) => (a.start || '') < (b.start || '') ? -1 : 1);
function eventsHtml(day){
  const evs = eventsOn(day);
  if (!evs.length) return '';
  return `<div class="list ev-list">${evs.map(e => `<div class="item ev">
    <div class="ev-time">${e.start ? esc(e.start) : '終日'}</div>
    <div class="body"><div class="title">${esc(e.title)}</div>${e.start && e.end ? `<div class="meta">〜${esc(e.end)}</div>` : ''}</div>
  </div>`).join('')}</div>`;
}

// 明日〜7日後を日付ごとに（タスクと予定を同じ日付の下に）
function upcomingHtml(){
  const ups = state.upcoming || [];
  const last = addDays(state.today, 7);
  const evDays = (state.events || []).map(e => e.date).filter(d => d > state.today && d <= last);
  const days = [...new Set([...ups.map(t => t['日付']), ...evDays])].sort();
  if (!days.length) return '';
  return `<section>
    <h2>これから <span class="n">7日間・タスク${ups.length}件</span></h2>
    ${days.map(day => {
      const ts = ups.filter(t => t['日付'] === day);
      return `<div class="day-head">${esc(md(day))}</div>
      ${eventsHtml(day)}
      ${ts.length ? `<div class="list">${ts.map(t => taskItem(t)).join('')}</div>` : ''}`;
    }).join('')}
  </section>`;
}

function projectsHtml(){
  const ps = state.projects || [];
  const groups = BIZ.map(b => ({b, items: ps.filter(p => p['事業'] === b.name)}))
    .concat([{b:{name:'事業未設定', v:'--b-self'}, items: ps.filter(p => bizOrder(p['事業']) === 99)}])
    .filter(g => g.items.length);
  const today = state.today;
  const open = id => (state.projTasks || []).filter(t => t['プロジェクトID'] === id && t['状態'] !== '済').length;
  return `<section>
    <h2>プロジェクト <span class="n">${ps.length}件</span><button class="link h-act" data-act="padd">＋追加</button></h2>
    ${ps.length ? groups.map(g => `
      <div class="biz-head" style="--c:var(${g.b.v})">${esc(g.b.name)}</div>
      <div class="list">${g.items.map(p => {
        const over = p['期限'] && p['期限'] < today;
        const n = open(p.ID);
        return `<button class="item proj tap" data-act="pview" data-id="${esc(p.ID)}" style="--c:var(${g.b.v})"><div class="body">
          <div class="title">${esc(p['名前'])}${p['状態']==='待ち' ? '<span class="chip wait">待ち</span>' : ''}${n ? `<span class="chip">${n}件</span>` : ''}</div>
          ${p['次の一手'] ? `<div class="next">${esc(p['次の一手'])}</div>` : ''}
          ${p['期限'] ? `<div class="meta ${over?'due-over':''}">期限 ${esc(mdShort(p['期限']))}${over?'（過ぎています）':''}</div>` : ''}
        </div></button>`;
      }).join('')}</div>`).join('')
    : `<p class="empty-note">進行中のプロジェクトはありません。</p>`}

function goalsHtml(){

      .sort((a,b) => bizOrder(a['事業']) - bizOrder(b['事業']));

        <div class="gt">${esc(g['内容'])}</div>
        <dl>
          ${g['期間'] ? `<dt>期間</dt><dd>${esc(g['期間'])}</dd>` : ''}
          ${g['指標'] ? `<dt>指標</dt><dd>${esc(g['指標'])}</dd>` : ''}
          ${g['現状'] ? `<dt>現状</dt><dd>${esc(g['現状'])}</dd>` : ''}

function decisionsHtml(){
  const ds = state.decisions || [];
  if (!ds.length) return '';
  const item = d => {
    const proj = d['プロジェクト名'] || d['プロジェクトID'];
    const url = /^https:\/\//.test(d['チャットURL']) ? d['チャットURL'] : '';
    return `<div class="item dec ${d['状態']==='撤回'?'is-void':''}" style="--c:var(${bizVar(projBiz(d['プロジェクトID']))})"><div class="body">

      <div class="meta">${esc(String(d['日時']).slice(5).replace('-','/'))}${proj ? '　' + esc(proj) : ''}${url ? `　<a href="${esc(url)}" target="_blank" rel="noopener">チャット</a>` : ''}</div>

const projBiz = id => ((state.projects || []).find(p => p.ID === id) || {})['事業'];

/* ---------- 操作 ---------- */
const allTasks = () => [...state.tasks, ...state.carry, ...(state.upcoming||[]), ...(state.waiting||[]), ...(state.someday||[]), ...(state.projTasks||[])];
const findTask = id => allTasks().find(t => t.ID === id);

async function act(fnLocal, call, okMsg){
  const backup = JSON.parse(JSON.stringify(state));
  fnLocal(); render();
  try { await call(); store.set('board.cache', state); if (okMsg) toast(okMsg); }
  catch(e){ state = backup; render(); toast('保存できませんでした：' + (e.message || e)); }
}

// 書き込んでから読み直す（編集・追加など、画面の複数の欄にまたがる変更用）
async function save(call, okMsg){
  toast('保存しています');
  try { await call(); toast(okMsg); await load(); }
  catch(e){ toast('保存できませんでした：' + (e.message || e)); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act){
    case 'toggle': {
      const t = findTask(id); if (!t) return;
      const next = t['状態'] === '済' ? '未' : '済';
      act(() => { allTasks().filter(x => x.ID === id).forEach(x => { x['状態'] = next; }); }, () => api('status', {id, status: next}));
      break;
    }
    case 'keep': {
      act(() => {
        const t = state.carry.find(x => x.ID === id);
        state.carry = state.carry.filter(x => x.ID !== id);
        t['日付'] = state.today; t['状態'] = '未'; state.tasks.push(t);
      }, () => api('keep', {id}), '今日に移しました');
      break;
    }
    case 'drop': {
      act(() => { state.carry = state.carry.filter(x => x.ID !== id); },
        () => api('status', {id, status:'捨'}), 'やめにしました');
      break;
    }
    case 'edit': { const t = findTask(id); if (t) openTask({mode:'edit', task:t}); break; }
    case 'pview': openProjView(id); break;
    case 'padd': openProj(null); break;
    case 'cand-take': {
      const c = (state.candidates || []).find(x => x['行ID'] === id); if (!c) return;
      openTask({mode:'cand', task:{'内容': String(c['原文']).replace(/^\[[^\]]*\]\s*/, ''), '日付': state.today}, inboxId:id});
      break;
    }
    case 'cand-drop': {
      act(() => { state.candidates = state.candidates.filter(x => x['行ID'] !== id); },
        () => api('cand', {rowId:id}), '不要にしました');
      break;
    }
    case 'reload': load(); toast('更新しています'); break;
    case 'settings': openSettings(); break;
  }
});

const bizRadios = (name) => BIZ.map(b => `<label style="--c:var(${b.v})"><input type="radio" name="${name}" value="${esc(b.name)}"><span>${esc(b.name)}</span></label>`).join('');
$('#bizPick').innerHTML = bizRadios('事業');
$('#pBizPick').innerHTML = bizRadios('事業');

// ダイアログのボタンは submit で受ける（close イベントは環境によって遅れたり来なかったりするため）
function onDialog(dlgSel, fn){
  const dlg = $(dlgSel), form = dlg.querySelector('form');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = e.submitter ? e.submitter.value : 'ok';
    dlg.close(v);
    if (v !== 'cancel') fn(v);
  });

function openTask(ctx){
  taskCtx = ctx;
  const f = $('#taskForm'), t = ctx.task || {};
  f.reset();
  $('#taskTitle').textContent = ctx.mode === 'edit' ? 'タスクを編集' : ctx.mode === 'cand' ? '候補をタスクにする' : 'タスクを追加';
  $('#btnTomorrow').hidden = ctx.mode !== 'edit';
  f['内容'].value = t['内容'] || '';
  const date = ctx.mode === 'edit' ? (t['日付'] || '') : (t['日付'] ?? state.today);
  f['日付'].value = date; f.nodate.checked = !date; f['日付'].disabled = !date;
  const biz = t['事業'] || (ctx.mode === 'edit' ? '' : BIZ[0].name);
  [...f.querySelectorAll('input[name="事業"]')].forEach(r => { r.checked = r.value === biz; });
  const ps = state.projects || [];
  const cur = t['プロジェクトID'] || '';
  f['プロジェクトID'].innerHTML = '<option value="">なし</option>'
    + ps.map(p => `<option value="${esc(p.ID)}">${esc(p['名前'])}</option>`).join('')
    + (cur && !ps.some(p => p.ID === cur) ? `<option value="${esc(cur)}">${esc(cur)}（完了済み）</option>` : '');
  f['プロジェクトID'].value = cur;
  f['状態'].value = t['状態'] || '未';
  f['期限'].value = t['期限'] || '';
  f['見込み分'].value = t['見込み分'] || '';
  f['メモ'].value = ctx.mode === 'edit' ? (t['メモ'] || '') : '';
  $('#taskDlg').showModal();
}
$('#taskForm').nodate.addEventListener('change', e => {
  const d = $('#taskForm')['日付'];
  d.disabled = e.target.checked;
  if (!e.target.checked && !d.value) d.value = state.today;
});

function taskFields(){
  const f = $('#taskForm'), fd = new FormData(f);
  return {
    '内容': String(fd.get('内容') || '').trim(),
    '日付': f.nodate.checked ? '' : f['日付'].value,
    '事業': fd.get('事業') || '',
    'プロジェクトID': f['プロジェクトID'].value,
    '状態': f['状態'].value,
    '期限': f['期限'].value,
    '見込み分': f['見込み分'].value,
    'メモ': String(fd.get('メモ') || '').trim(),
  };
}

onDialog('#taskDlg', rv => {
  const ctx = taskCtx;
  if (!ctx) return;
  if (rv === 'tomorrow'){
    const base = ctx.task['日付'] && ctx.task['日付'] >= state.today ? ctx.task['日付'] : state.today;
    const next = addDays(base, 1);
    save(() => api('update', {id:ctx.task.ID, fields:{'日付':next, '状態': ctx.task['状態'] === '繰越' ? '未' : ctx.task['状態']}}), mdShort(next) + 'に移しました');
    return;
  }
  const fields = taskFields();
  if (!fields['内容']) return;
  if (ctx.mode === 'edit'){
    // 変わった列だけ送る
    const diff = {};
    Object.keys(fields).forEach(k => { if (String(ctx.task[k] ?? '') !== fields[k]) diff[k] = fields[k]; });
    if (!Object.keys(diff).length) return;
    save(() => api('update', {id:ctx.task.ID, fields:diff}), '保存しました');
  } else {
    if (!fields['メモ']) delete fields['メモ'];
    save(() => api('add', {fields, inboxId: ctx.inboxId || ''}), '追加しました');
  }
});

let demo = null;
function demoApi(action, p){
  const ymd = dt => new Date(dt.getTime() + 9*3600e3).toISOString().slice(0,10);
  const today = ymd(new Date()), day = n => addDays(today, n);
  if (!demo) demo = {
    tasks:[
      {ID:'T1','日付':today,'内容':'週末イベントのスタッフ名簿を送る','事業':'ギガネット（通信）','状態':'未','メモ':'','期限':'','見込み分':'15'},
      {ID:'T2','日付':today,'内容':'交通費申請の未提出者にリマインド','事業':'ギガネット（通信）','状態':'済','メモ':''},
      {ID:'T3','日付':today,'内容':'新商品の箱 修正版を確認に出す','事業':'円山製麺','状態':'未','メモ':'','プロジェクトID':'P3'},
      {ID:'T5','日付':today,'内容':'メニューPOPの英語表記を確認','事業':'SHEEP GANG','状態':'未','メモ':''},
      {ID:'T0','日付':day(-1),'内容':'インスタ ストーリー投稿','事業':'円山製麺','状態':'未','メモ':''},
      {ID:'T7','日付':day(2),'内容':'売り場の全体デザイン提案','事業':'円山製麺','状態':'未','メモ':'','プロジェクトID':'P3','期限':day(2)},
      {ID:'T8','日付':day(5),'内容':'月初の交通費回収','事業':'エルダイブ','状態':'未','メモ':''},
      {ID:'T9','日付':day(1),'内容':'契約書の返送','事業':'ギガネット（通信）','状態':'待ち','メモ':'先方の確認待ち','期限':day(4)},
      {ID:'T10','日付':'','内容':'経費精算','事業':'エルダイブ','状態':'保留','メモ':'月末にまとめる'},
    ],
    events:[
      {date:today, start:'10:00', end:'18:00', title:'事務所'},
      {date:day(2), start:'', end:'', title:'直売事務所'},
      {date:day(4), start:'09:30', end:'17:00', title:'イベント会場'},
    ],
    recur:[
      {ID:'R1','名前':'スタッフ交通費回収','事業':'エルダイブ','周期':'毎月','開始日':'1','期限日':'1','見込み分':'30','手順':'','有効':'TRUE','メモ':''},
      {ID:'R2','名前':'直売前の印刷業務','事業':'円山製麺','周期':'直売日前日','開始日':'','期限日':'','見込み分':'','手順':'賞味期限ラベル確認・印刷\nちらし印刷','有効':'TRUE','メモ':''},
    ],
    inbox:[{'行ID':'L1','日時':today+' 09:00','原文':'[Todoist] チラシを作るか検討','仕分け先':'候補（未確認）'}],
    projects:[
      {ID:'P1','名前':'ショッピングモール催事','事業':'ギガネット（通信）','状態':'進行中','次の一手':'駐車場の台数を確定','期限':day(12)},
      {ID:'P3','名前':'新商品パッケージ','事業':'円山製麺','状態':'進行中','次の一手':'箱の入稿データ作成','期限':day(-1)},
      {ID:'P5','名前':'社内ToDoアプリ','事業':'エルダイブ','状態':'待ち','次の一手':'3人で公開範囲を決める','期限':''},
    ],
    goals:[
      {ID:'G1','種類':'自分','期間':'月','内容':'週報を記録から自動で作れる状態にする','指標':'週報作成 1時間以内','現状':'ボード運用開始'},
      {ID:'G2','種類':'事業','期間':'週','内容':'店舗 1週間の売上目標を達成','指標':'週の売上','現状':'','事業':'円山製麺'},
    ],
    decisions:[
      {'日時':today+' 11:20','プロジェクトID':'P3','プロジェクト名':'新商品パッケージ','内容':'説明書は箱と別紙にする','状態':'確定','理由・却下案':'箱に印刷すると修正のたびに版代がかかる。却下案：箱の内側に印刷','チャットURL':'https://claude.ai/'},
    ],
  };
  const T = demo.tasks, find = id => T.find(x => x.ID === id);
  const open = s => s === '未' || s === '' || s === '繰越', wait = s => s === '待ち' || s === '保留';
  return new Promise(r => setTimeout(r, 150)).then(() => {
    if (action === 'data'){
      const in7 = day(7);
      return JSON.parse(JSON.stringify({
        today,
        tasks: T.filter(t => t['日付'] === today && t['状態'] !== '捨' && !wait(t['状態'])),
        carry: T.filter(t => t['日付'] && t['日付'] < today && open(t['状態'])),
        upcoming: T.filter(t => t['日付'] > today && t['日付'] <= in7 && (open(t['状態']) || wait(t['状態']))).sort((a,b) => a['日付'] < b['日付'] ? -1 : 1),
        waiting: T.filter(t => wait(t['状態'])),
        someday: T.filter(t => !t['日付'] && open(t['状態'])),
        projTasks: T.filter(t => t['プロジェクトID'] && t['状態'] !== '捨'),
        projects: demo.projects.filter(x => x['状態'] !== '完了'),
        goals: demo.goals, decisions: demo.decisions,
        candidates: demo.inbox.filter(x => x['仕分け先'] === '候補（未確認）'),
        events: demo.events,
        fetchedAt: today + ' ' + new Date().toTimeString().slice(0,5)
      }));
    }
    if (action === 'status'){ const t = find(p.id); if (t) t['状態'] = p.status; return {}; }
    if (action === 'keep'){ const t = find(p.id); if (t){ t['日付'] = today; t['状態'] = '未'; } return {}; }
    if (action === 'add'){
      const id = 'T' + Date.now(); const f = p.fields || {'内容':p.text,'事業':p.biz};
      T.push({ID:id, '日付': '日付' in f ? f['日付'] : today, '状態':'未', 'メモ':'', ...f});
      if (p.inboxId){ const c = demo.inbox.find(x => x['行ID'] === p.inboxId); if (c){ c['仕分け先'] = 'タスク追加'; c['反映先ID'] = id; } }
      return {id};
    }
    if (action === 'update'){ Object.assign(find(p.id), p.fields); return {}; }
    if (action === 'padd'){ const id = 'P' + Date.now(); demo.projects.push({ID:id, ...p.fields}); return {id}; }
    if (action === 'pupdate'){ Object.assign(demo.projects.find(x => x.ID === p.id), p.fields); return {}; }
    if (action === 'recur') return JSON.parse(JSON.stringify(demo.recur));
    if (action === 'rupdate'){ Object.assign(demo.recur.find(x => x.ID === p.id), p.fields); return {}; }
    if (action === 'cand'){ const c = demo.inbox.find(x => x['行ID'] === p.rowId); if (c) c['仕分け先'] = '候補（不要）'; return {}; }
  });
}

/* 起動 */
render();
if (cfg.url) load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
