<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ボード</title>
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151B23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ボード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --surface:#F7F9FB; --ink:#1C2733; --sub:#5B6775; --line:#D3DAE2; --accent:#2F55C8;
  --b-giga:#2563C9; --b-maru:#B98117; --b-sheep:#8C3B2C; --b-eld:#7A4CCB; --b-poto:#2D8A6C; --b-self:#6B7480;
  --danger:#B23A3A;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151B23; --surface:#1D2530; --ink:#E6EBF1; --sub:#98A3B1; --line:#2E3946; --accent:#7D9BF2;
    --b-giga:#6E9BEA; --b-maru:#DDAA48; --b-sheep:#D17A68; --b-eld:#A887E6; --b-poto:#5DBB98; --b-self:#9AA3AE;
    --danger:#E07272;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:16px; line-height:1.55; font-feature-settings:"palt";
  padding:0 0 calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:none;margin:0;padding:0 clamp(16px,2.5vw,40px)}

/* ---- 今日の見出し ---- */
.today{padding:20px 0 18px}
.today-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.date{font-weight:900;font-size:56px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date small{font-size:20px;font-weight:700;margin-left:6px;letter-spacing:0;color:var(--sub)}
.count{font-size:14px;color:var(--sub);text-align:right;line-height:1.3}
.count b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:3px;margin-top:14px;height:10px}
.strip span{flex:1;border-radius:2px;background:var(--c);opacity:.22}
.strip span.done{opacity:1}
.strip.empty span{background:var(--line);opacity:1}

/* ---- セクション ---- */
section{margin-top:28px}
h2{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2 .n{font-weight:500;color:var(--sub);font-size:13px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px 13px 0;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item::before{content:"";align-self:stretch;width:4px;border-radius:0 3px 3px 0;background:var(--c,var(--b-self));flex:none}
.body{flex:1;min-width:0}
.title{word-break:break-word}
.meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.meta .biz{color:var(--c)}
.empty-note{padding:16px;color:var(--sub);font-size:14px;background:var(--surface);border-radius:14px}

/* チェック */
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--sub));background:transparent;margin-top:-1px;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.item.is-done .check{background:var(--c)}
.item.is-done .check svg{opacity:1}
.item.is-done .title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1px}

/* 繰越 */
.carry .acts{display:flex;gap:6px;flex:none}
.btn-s{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px}
.btn-s.keep{border-color:var(--accent);color:var(--accent)}
.btn-s.drop{color:var(--sub)}

/* プロジェクト */
.biz-head{font-size:13px;font-weight:700;color:var(--c);margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.biz-head::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.proj .next{font-size:14px;margin-top:3px}
.proj .next::before{content:"次 ";color:var(--sub);font-size:12px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--sub);margin-left:6px;vertical-align:1px}
.chip.wait{border-color:var(--b-maru);color:var(--b-maru)}
.due-over{color:var(--danger);font-weight:700}

/* 目標 */
.goals{display:grid;gap:10px}
.goal-block{background:var(--surface);border-radius:14px;padding:14px 16px}
.goal-block h3{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:700}
.goal{padding:8px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.goal .gt{font-weight:700}
.goal .gbiz{display:inline-block;font-size:12px;font-weight:700;color:var(--c);border-left:3px solid var(--c);padding-left:6px;margin-bottom:2px}
.goal dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.goal dt{color:var(--sub)}
.goal dd{margin:0}

/* 決定ログ */
.dec .title{font-size:15px}
.dec .why{font-size:13px;color:var(--sub);margin-top:3px;white-space:pre-wrap}
.dec .why::before{content:"理由・却下案 ";font-size:11.5px}
.chip.st-確定{border-color:var(--accent);color:var(--accent)}
.chip.st-保留{border-color:var(--b-maru);color:var(--b-maru)}
.item.is-void .title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1px}
.dec a{color:var(--accent);text-decoration:none}
.more{margin-top:8px}
.more summary{font-size:13px;color:var(--accent);cursor:pointer;padding:6px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more .list{margin-top:6px}

/* 下部 */
.foot{margin-top:28px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--accent);padding:6px 0;font-size:13px}
.fab{position:fixed;right:max(16px,2vw);bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(20,40,90,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

/* シート */
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,24,.45)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.bizpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bizpick label{position:relative}
.bizpick input{position:absolute;opacity:0}
.bizpick span{display:block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px}
.bizpick input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.bizpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.row-btns{display:flex;gap:8px;justify-content:flex-end}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:transparent;border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--sub);margin:-4px 0 12px}
.err{color:var(--danger);font-size:14px;padding:14px 16px;background:var(--surface);border-radius:14px;margin-top:16px}

/* 追加分 */
/* ---- 完了したタスク：各欄の右下に「完了 N件」。押すと開く ---- */
.done-wrap{margin-top:8px}
.done-box>summary{display:block;width:max-content;margin-left:auto;list-style:none;cursor:pointer;font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--surface)}
.done-box>summary::-webkit-details-marker{display:none}
.done-box[open]>summary{color:var(--accent);border-color:var(--accent)}
.done-box .list{margin-top:8px}
/* チェックしたタスクがすっと消える */
.item.leaving,.cal-task.leaving{opacity:0;transform:translateX(14px);transition:opacity .2s,transform .2s}
/* 「元に戻す」付きのお知らせ */
.toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast-act{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}

/* ---- 上に固定する帯（更新・設定） ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) clamp(16px,2.5vw,40px) 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.tb-title{font-weight:900;font-size:17px}
.tb-stamp{font-size:12.5px;color:var(--sub);flex:1}
.tb-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tb-btn svg{width:16px;height:16px}
.tb-btn.spin svg{animation:spin .8s linear infinite}
.tb-btn.plain{border-color:transparent;background:transparent;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translate(-50%,-16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 14px;border-radius:999px;z-index:40;transition:opacity .15s}
.ptr.ready{background:var(--accent);color:#fff}

/* ---- 月カレンダー（全部の月を前後に送って見る） ---- */
#monthDlg{max-width:1100px}
.m-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.m-head h3{margin:0;flex:1;text-align:center;font-size:17px;min-width:120px}
.m-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:12px;color:var(--sub);text-align:center;margin-bottom:4px}
.m-wd .sun{color:var(--danger)}.m-wd .sat{color:var(--b-giga)}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.m-cell{background:var(--bg);border-radius:10px;padding:5px 4px;min-height:58px;border:2px solid transparent;cursor:pointer;overflow:hidden;min-width:0}
.m-cell.dim{opacity:.45}
.m-cell.sel{border-color:var(--accent)}
.m-d{font-size:13px;font-weight:700;display:inline-block;min-width:22px;text-align:center;border-radius:999px}
.m-cell.sun .m-d{color:var(--danger)}.m-cell.sat .m-d{color:var(--b-giga)}
.m-cell.today .m-d{background:var(--accent);color:#fff}
.m-full{display:none}
.m-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.m-t{font-size:11px;line-height:1.3;padding:1px 4px;margin-top:2px;border-left:3px solid var(--c);background:var(--surface);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-t.is-done{color:var(--sub);text-decoration:line-through}
.m-ev{font-size:10.5px;line-height:1.3;padding:1px 4px;margin-top:2px;color:var(--sub);border-left:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-more{font-size:10.5px;color:var(--sub);margin-top:2px}
#mDetail{margin-top:14px}
@media (min-width:700px){
  .m-full{display:block}
  .m-dots{display:none}
  .m-cell{min-height:104px;padding:6px}
}

/* ---- 画面全体の並べ方：狭いと1列、広いと2〜3列 ---- */
#app{display:block}
.a-works{grid-area:works}.a-head{grid-area:head}.a-left{grid-area:left}.a-cal{grid-area:cal}
.a-mid{grid-area:mid}.a-right{grid-area:right}.a-foot{grid-area:foot}
@media (min-width:700px){
  #app{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;align-items:start;
    grid-template-areas:"works works" "head head" "left left" "cal cal" "mid right" "foot foot"}
  dialog{margin:auto;border-radius:18px}
}
@media (min-width:1100px){
  #app{grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-areas:"works works works" "head head head" "left cal cal" "left mid right" "foot foot foot"}
}

/* ---- カレンダー（7日間を横に並べる） ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-day{background:var(--surface);border-radius:12px;padding:8px 4px;min-height:76px;cursor:pointer;border:2px solid transparent;min-width:0}
.cal-day.sel{border-color:var(--accent)}
.cal-h{display:flex;align-items:baseline;gap:3px;justify-content:center;margin-bottom:6px}
.cal-h b{font-size:17px;font-variant-numeric:tabular-nums}
.cal-h small{font-size:11px;color:var(--sub)}
.cal-day.sun .cal-h b,.cal-day.sun .cal-h small{color:var(--danger)}
.cal-day.sat .cal-h b,.cal-day.sat .cal-h small{color:var(--b-giga)}
.cell-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--b-self))}
.dot.ev{background:transparent;border:2px solid var(--sub);box-sizing:border-box}
.cell-full{display:none}
.cal-detail{margin-top:12px}
.cal-task{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;border-left:3px solid var(--c);margin-top:4px;background:var(--bg);border-radius:6px}
.cal-chk{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;margin-top:1px}
.cal-task.is-done .cal-chk{background:var(--c)}
.cal-task.is-done .cal-title{color:var(--sub);text-decoration:line-through}
.cal-title{font-size:11.5px;line-height:1.35;word-break:break-word;flex:1;min-width:0}
.cal-ev{font-size:11.5px;color:var(--sub);padding:4px 6px;border-left:3px solid var(--line);margin-top:4px;line-height:1.35;word-break:break-word}
.cal-ev span{margin-right:5px;font-variant-numeric:tabular-nums}
@media (min-width:700px){
  .cell-dots{display:none}
  .cell-full{display:block}
  .cal-detail{display:none}
  .cal-day{padding:10px 8px;min-height:150px;cursor:default}
  .cal-h{justify-content:flex-start}
}

/* ---- 事業をタップしたときの中身 ---- */
.bv-sec{font-size:13px;color:var(--sub);margin:12px 0 6px;font-weight:700}
.bv-works{display:flex;flex-wrap:wrap;gap:6px}
.bv-works span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13.5px}

/* 事業カード：画面の幅いっぱいに折り返して並べる（横スクロールなし） */
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button.wcard{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;text-align:left;font:inherit;color:inherit;border:0;cursor:pointer;background:var(--surface);border-radius:14px;padding:12px 14px;border-top:4px solid var(--c)}
button.wcard:active{opacity:.7}
.wcard h3{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--c)}
.wcard .wfoot{margin-top:auto;padding-top:8px;font-size:12px;color:var(--sub)}
.works-sec{margin-top:14px}
.wcard ul{margin:0;padding:0;list-style:none}
.wcard li{font-size:14.5px;padding:5px 0;border-top:1px solid var(--line)}
.wcard li:first-child{border-top:0;padding-top:0}

.item.ev{padding:10px 14px 10px 0}
.item.ev::before{background:var(--line)}
.ev-time{flex:none;width:44px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .title{font-size:14.5px}
.ev-list{margin-bottom:6px}
.rec{padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .rec-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.rec .rec-h b{font-size:15px}
.rec .rec-h .chk{margin-bottom:0}
.rec .meta{margin:2px 0 8px}
.rec .field{margin-bottom:8px}
.rec .row-btns{justify-content:flex-start}
#recBody{max-height:60vh;overflow:auto}

button.tap{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.item .body.tap{flex:1;min-width:0}
button.item.proj{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;font:inherit;color:inherit}
.list>button.item:first-child{border-top:0}
.day-head{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
h2 .h-act{margin-left:auto;font-size:13px;padding:0}
.chip.wait{border-color:var(--b-maru);color:var(--b-maru)}
.cands summary{font-size:15px;font-weight:700;color:var(--ink)}
.cands summary .n{font-weight:500;color:var(--sub);font-size:13px}
.cand .title{font-size:14px}
.cand{padding-left:14px}
.cand::before{display:none}
.field-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field-row .field{flex:1;min-width:120px}
.field-row .field.narrow{flex:0 0 96px;min-width:0}
.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 10px;font-size:16px}
.field input:disabled{opacity:.45}
.field textarea.short{min-height:52px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:24px;white-space:nowrap}
.row-btns .left{margin-right:auto}
dialog{max-height:92vh;overflow:auto}
.pv-meta{margin:-6px 0 8px}
.pv-next{margin:0 0 12px;font-size:14px}
.pv-h{font-size:13px;color:var(--sub);margin:14px 0 6px}
#pvBody .list{margin-bottom:12px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <span class="tb-title">ボード</span>
  <span class="tb-stamp" id="stamp"></span>
  <button class="tb-btn" id="btnRefresh" data-act="reload" aria-label="サイトを更新する">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>更新
  </button>
  <button class="tb-btn plain" data-act="settings">設定</button>
</div>
<div class="ptr" id="ptr">↓ 引いて更新</div>
<main class="wrap" id="app" aria-live="polite"></main>

<button class="fab" id="fab" aria-label="タスクを追加">＋</button>
<div class="toast" id="toast" role="status"></div>

<!-- タスクの追加・編集（共通） -->
<dialog id="taskDlg">
  <form class="sheet" method="dialog" id="taskForm">
    <h3 id="taskTitle">タスクを追加</h3>
    <label class="field"><span>内容</span><textarea name="内容" required></textarea></label>
    <div class="field-row">
      <label class="field"><span>日付</span><input type="date" name="日付"></label>
      <label class="chk"><input type="checkbox" name="nodate"> 日付なし</label>
    </div>
    <div class="bizpick" id="bizPick"></div>
    <label class="field"><span>プロジェクト</span><select name="プロジェクトID"></select></label>
    <div class="field-row">
      <label class="field"><span>状態</span><select name="状態"></select></label>
      <label class="field"><span>期限</span><input type="date" name="期限"></label>

<dialog id="projDlg">

    <label class="field"><span>名前</span><input name="名前" required autocomplete="off"></label>

      <label class="field"><span>状態</span><select name="状態"><option>進行中</option><option>待ち</option><option>完了</option></select></label>
      <label class="field"><span>期限</span><input type="date" name="期限"></label>
    </div>
    <label class="field"><span>次の一手</span><textarea name="次の一手" class="short"></textarea></label>

<!-- 定期タスク（設定の中） -->
<dialog id="recDlg">
  <div class="sheet">
    <h3>定期タスク</h3>
    <p class="hint">毎日5時に、開始日が7日以内に来る回のタスクを作ります。名前・周期・日付はスプシの「定期」タブで直します。</p>
    <div id="recBody"></div>
    <div class="row-btns"><button class="btn sec" id="recClose">閉じる</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <form class="sheet" method="dialog" id="setForm">
    <h3>接続の設定</h3>
    <p class="hint">GASのウェブアプリURLと、setupで出た合言葉を入れます。この端末にだけ保存されます。URLに demo と入れると見本データで表示します。</p>
    <label class="field"><span>ウェブアプリURL</span><input name="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>合言葉</span><input name="key" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="row-btns">
      <button class="btn sec left" type="button" id="btnRecur">定期タスク</button>
      <button class="btn sec" value="cancel" formnovalidate>やめる</button>
      <button class="btn pri" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<script>
const BIZ = [
  {name:'ギガネット（通信）', v:'--b-giga'},
  {name:'円山製麺', v:'--b-maru'},
  {name:'SHEEP GANG', v:'--b-sheep'},
  {name:'エルダイブ', v:'--b-eld'},
  {name:'ぽとふ', v:'--b-poto'},
  {name:'個人', v:'--b-self'},
];
const TASK_STATUS = ['未','済','待ち','保留','繰越','捨'];
const bizVar = n => (BIZ.find(b => b.name === n) || {v:'--b-self'}).v;
const bizOrder = n => { const i = BIZ.findIndex(b => b.name === n); return i < 0 ? 99 : i; };
const WD = ['日','月','火','水','木','金','土'];
// yyyy-mm-dd に日数を足す
const addDays = (ymd, n) => { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const md = ymd => { const d = new Date(ymd + 'T00:00:00Z'); return `${d.getUTCMonth()+1}/${d.getUTCDate()}（${WD[d.getUTCDay()]}）`; };
const mdShort = ymd => String(ymd).slice(5).replace('-','/');
// 内容をひとことに縮める（カッコの中と、最初の読点までで切って、長ければ省略）
function short(text, n = 13){
  let t = String(text || '').replace(/[（(][^）)]*[）)]/g, '').replace(/\s+/g, ' ').trim();
  const head = t.split(/[、。，,]/)[0].trim();
  if (head.length >= 6) t = head;   // 切った結果が短すぎる（「近藤さんに」など）ときは、全体を使う
  if (!t) t = String(text || '');
  return t.length > n ? t.slice(0, n) + '…' : t;
}

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let cfg = store.get('board.cfg', {url:'', key:''});
let state = store.get('board.cache', null);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, opt){
  const t = $('#toast'); t.textContent = msg;
  if (opt && opt.label){
    const b = document.createElement('button');
    b.className = 'toast-act'; b.textContent = opt.label;
    b.addEventListener('click', () => { t.classList.remove('show'); clearTimeout(toast._t); opt.fn(); });
    t.appendChild(b);
  }
  t.classList.toggle('has-act', !!(opt && opt.label));
  t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), (opt && opt.ms) || 2200);
}
const nowStr = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 16).replace('T', ' ');
// 完了にした直後だけ、しばらく「元に戻す」を出す
function showUndo(id, prev){
  toast('完了にしました', {label:'元に戻す', ms:7000, fn: () => {
    const st = prev && prev !== '済' ? prev : '未';
    act(() => { allTasks().filter(x => x.ID === id).forEach(x => { x['状態'] = st; x['完了日時'] = ''; }); },
      () => api('status', {id, status: st}), '元に戻しました');
  }});
}

/* ---------- 通信 ---------- */
async function api(action, params = {}){
  if (cfg.url === 'demo') return demoApi(action, params);
  if (!cfg.url || !cfg.key) throw new Error('not_configured');
  // 合言葉はURLに載せず、すべて本文で送る
  const res = await fetch(cfg.url, {method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, key:cfg.key, ...params})});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.data;
}

async function load(){
  try {
    state = await api('data');
    store.set('board.cache', state);
    render();
  } catch(e){
    render(e);
  }
}

/* ---------- 描画 ---------- */
function render(err){
  renderMain(err);
  $('#stamp').textContent = state && state.fetchedAt ? String(state.fetchedAt).slice(11) + ' 時点' : '';
  if ($('#bizView').open) fillBiz();
  if ($('#monthDlg').open) fillMonth();
}
function renderMain(err){
  const app = $('#app');
  if (!cfg.url){
    app.innerHTML = `<div class="today"><div class="date">ボード</div></div>
      <p class="empty-note">接続先がまだ設定されていません。</p>
      <div class="foot"><span></span><button class="link" data-act="settings">接続を設定する</button></div>`;
    return;
  }
  if (!state){
    app.innerHTML = `<div class="today"><div class="date">…</div></div>` + (err ? errBox(err) : '');
    return;
  }
  const d = new Date(state.today + 'T00:00:00+09:00');
  const tasks = [...state.tasks].sort((a,b) => (a['状態']==='済') - (b['状態']==='済') || bizOrder(a['事業']) - bizOrder(b['事業']));
  const done = tasks.filter(t => t['状態'] === '済').length;
  const strip = tasks.length
    ? tasks.map(t => `<span class="${t['状態']==='済'?'done':''}" style="--c:var(${bizVar(t['事業'])})"></span>`).join('')
    : '<span></span>';
  const openT = tasks.filter(t => t['状態'] !== '済');
  const waiting = (state.waiting || []).filter(t => t['状態'] !== '済');
  const somedayOpen = (state.someday || []).filter(t => t['状態'] !== '済');
  const somedayDone = doneBox('someday');
  const cands = state.candidates || [];

  app.innerHTML = `
    <div class="a-works">${worksHtml()}</div>
    <div class="a-head">
      <header class="today">
        <div class="today-row">
          <div class="date">${d.getMonth()+1}/${d.getDate()}<small>${WD[d.getDay()]}</small></div>
          <div class="count"><b>${done}/${tasks.length}</b>今日の完了</div>
        </div>
        <div class="strip ${tasks.length?'':'empty'}" aria-hidden="true">${strip}</div>
      </header>
      ${err ? errBox(err) : ''}
    </div>
    <div class="a-left">
      ${state.carry.length ? `
      <section class="carry">
        <h2>前日までの残り <span class="n">${state.carry.length}件 ・ 今日やるか、やめるか</span></h2>
        <div class="list">${state.carry.map(carryItem).join('')}</div>
      </section>` : ''}
      <section>
        <h2>今日やること <span class="n">${openT.length}件</span></h2>
        ${eventsHtml(state.today)}
        ${openT.length ? `<div class="list">${openT.map(t => taskItem(t)).join('')}</div>`
          : `<p class="empty-note">${tasks.length ? '今日のタスクは全部終わりました。' : '今日のタスクはまだありません。右下の＋か、Claudeに送って追加します。'}</p>`}
        ${doneBox('today')}
      </section>
      ${waiting.length ? `
      <section>
        <h2>待ち・保留 <span class="n">${waiting.length}件</span></h2>
        <div class="list">${waiting.map(t => taskItem(t, {showDate:true})).join('')}</div>
      </section>` : ''}
    </div>
    <div class="a-cal">${upcomingHtml()}</div>
    <div class="a-mid">${goalsHtml()}</div>
    <div class="a-right">
      ${decisionsHtml()}
      ${somedayOpen.length || somedayDone ? `
      <section>
        <h2>日付なし <span class="n">${somedayOpen.length}件</span></h2>
        ${somedayOpen.length ? `<div class="list">${somedayOpen.map(t => taskItem(t)).join('')}</div>` : ''}
        ${somedayDone}
      </section>` : ''}
      ${cands.length ? `
      <section>
        <details class="more cands">
          <summary>候補 ${cands.length}件 <span class="n">Claudeが拾った未確認のもの</span></summary>
          <div class="list">${cands.map(candItem).join('')}</div>
        </details>
      </section>` : ''}
    </div>
    <div class="foot a-foot">
      <span>${esc(state.fetchedAt)} 時点</span>
      <span></span>
    </div>`;
}

function errBox(e){
  const m = String(e.message || e);
  const msg = m === 'unauthorized' ? '合言葉が一致しません。設定を確認してください。'
    : m === 'not_configured' ? '接続先が未設定です。'
    : /Failed to fetch|NetworkError|Load failed/.test(m) ? '通信できませんでした。前回読み込んだ内容を表示しています。'
    : 'エラー：' + m;
  return `<div class="err" role="alert">${esc(msg)}</div>`;
}

function taskItem(t, opt = {}){
  const isDone = t['状態'] === '済';
  const st = t['状態'] === '待ち' || t['状態'] === '保留' ? `<span class="chip wait">${esc(t['状態'])}</span>` : '';
  const meta = [
    `<span class="biz">${esc(t['事業'] || '事業未設定')}</span>`,
    opt.showDate && t['日付'] ? esc(mdShort(t['日付'])) : '',
    t['期限'] ? `<span class="${t['期限'] < state.today && !isDone ? 'due-over' : ''}">期限 ${esc(mdShort(t['期限']))}</span>` : '',
    t['見込み分'] ? esc(t['見込み分']) + '分' : '',
    t['メモ'] ? esc(t['メモ']) : '',
  ].filter(Boolean).join('　');
  return `<div class="item ${isDone?'is-done':''}" style="--c:var(${bizVar(t['事業'])})">
    <button class="check" data-act="toggle" data-id="${esc(t.ID)}" aria-label="${isDone?'未完了に戻す':'完了にする'}：${esc(t['内容'])}">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
    </button>
    <button class="body tap" data-act="edit" data-id="${esc(t.ID)}">
      <div class="title">${esc(t['内容'])}${st}</div>
      <div class="meta">${meta}</div>
    </button>
  </div>`;
}

function carryItem(t){
  return `<div class="item" style="--c:var(${bizVar(t['事業'])})">
    <button class="body tap" data-act="edit" data-id="${esc(t.ID)}">
      <div class="title">${esc(t['内容'])}</div>
      <div class="meta"><span class="biz">${esc(t['事業'] || '事業未設定')}</span>　${esc(mdShort(t['日付']))}の分</div>
    </button>
    <div class="acts">
      <button class="btn-s keep" data-act="keep" data-id="${esc(t.ID)}">今日やる</button>
      <button class="btn-s drop" data-act="drop" data-id="${esc(t.ID)}">やめる</button>
    </div>
  </div>`;
}

function candItem(c){
  return `<div class="item cand">
    <div class="body">
      <div class="title">${esc(c['原文'])}</div>
      <div class="meta">${esc(String(c['日時']).slice(5, 10).replace('-','/'))}</div>
    </div>
    <div class="acts">
      <button class="btn-s keep" data-act="cand-take" data-id="${esc(c['行ID'])}">載せる</button>
      <button class="btn-s drop" data-act="cand-drop" data-id="${esc(c['行ID'])}">不要</button>
    </div>
  </div>`;
}

// カレンダーの予定（チェック丸なし。終日は時刻の代わりに「終日」）
const eventsOn = day => (state.events || []).filter(e => e.date === day)
  .sort((a,b) => (a.start || '') < (b.start || '') ? -1 : 1);
function eventsHtml(day){
  const evs = eventsOn(day);
  if (!evs.length) return '';
  return `<div class="list ev-list">${evs.map(e => `<div class="item ev">
    <div class="ev-time">${e.start ? esc(e.start) : '終日'}</div>
    <div class="body"><div class="title">${esc(e.title)}</div>${e.start && e.end ? `<div class="meta">〜${esc(e.end)}</div>` : ''}</div>
  </div>`).join('')}</div>`;
}

// カレンダー：明日から7日間を横に並べる。狭い画面は点だけ出して、タップした日の中身を下に出す
let calSel = null;
function calTask(t){
  const done = t['状態'] === '済', wait = t['状態'] === '待ち' || t['状態'] === '保留';
  return `<div class="cal-task ${done?'is-done':''}" style="--c:var(${bizVar(t['事業'])})">
    <button class="cal-chk" data-act="toggle" data-id="${esc(t.ID)}" aria-label="${done?'未完了に戻す':'完了にする'}：${esc(t['内容'])}"></button>
    <button class="tap cal-title" data-act="edit" data-id="${esc(t.ID)}">${esc(short(t['内容']))}${wait ? `<span class="chip wait">${esc(t['状態'])}</span>` : ''}</button>
  </div>`;
}
// 完了したタスク（各欄の右下の「完了 N件」）
const doneOpen = {};
function doneList(kind){
  const t0 = state.today, in7 = addDays(t0, 7);
  const day = t => String(t['完了日時'] || '').slice(0, 10);
  const seen = new Set(), out = [];
  allTasks().forEach(t => {
    if (t['状態'] !== '済' || seen.has(t.ID)) return;
    const d = t['日付'] || '';
    const ok = kind === 'today' ? (d === t0 || day(t) === t0)
      : kind === 'upcoming' ? (d > t0 && d <= in7)
      : kind === 'someday' ? (!d && day(t) !== '' && day(t) >= addDays(t0, -14))
      : false;
    if (ok){ seen.add(t.ID); out.push(t); }
  });
  return out.sort((a, b) => String(b['完了日時'] || '') < String(a['完了日時'] || '') ? -1 : 1);
}
function doneBox(kind){
  const list = doneList(kind);
  if (!list.length) return '';
  return `<div class="done-wrap"><details class="done-box" data-kind="${kind}" ${doneOpen[kind] ? 'open' : ''}>
    <summary>完了 ${list.length}件</summary>
    <div class="list">${list.map(t => taskItem(t, {showDate: kind !== 'today'})).join('')}</div>
  </details></div>`;
}
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.classList && d.classList.contains('done-box')) doneOpen[d.dataset.kind] = d.open;
}, true);

function upcomingHtml(){
  const ups = (state.upcoming || []).filter(t => t['状態'] !== '済');
  const days = Array.from({length: 7}, (_, i) => addDays(state.today, i + 1));
  const has = d => ups.some(t => t['日付'] === d) || eventsOn(d).length > 0;
  const sel = calSel && days.includes(calSel) ? calSel : (days.find(has) || days[0]);
  const cells = days.map(day => {
    const ts = ups.filter(t => t['日付'] === day), es = eventsOn(day);
    const wd = new Date(day + 'T00:00:00Z').getUTCDay();
    const dots = es.map(() => '<i class="dot ev"></i>').join('')
      + ts.map(t => `<i class="dot" style="--c:var(${bizVar(t['事業'])})"></i>`).join('');
    return `<div class="cal-day ${wd===0?'sun':wd===6?'sat':''} ${day===sel?'sel':''}" data-act="calday" data-day="${day}">
      <div class="cal-h"><b>${+day.slice(8)}</b><small>${WD[wd]}</small></div>
      <div class="cell-dots">${dots}</div>
      <div class="cell-full">
        ${es.map(e => `<div class="cal-ev"><span>${e.start ? esc(e.start) : '終日'}</span>${esc(e.title)}</div>`).join('')}
        ${ts.map(calTask).join('')}
      </div>
    </div>`;
  }).join('');
  const dts = ups.filter(t => t['日付'] === sel);
  return `<section id="cal">
    <h2>これから <span class="n">7日間・タスク${ups.length}件</span><button class="link h-act" data-act="month">月カレンダー</button></h2>
    <div class="cal">${cells}</div>
    <div class="cal-detail">
      <div class="day-head">${esc(md(sel))}</div>
      ${eventsHtml(sel)}
      ${dts.length ? `<div class="list">${dts.map(t => taskItem(t)).join('')}</div>`
        : (eventsOn(sel).length ? '' : '<p class="empty-note">この日の予定・タスクはありません。</p>')}
    </div>
    ${doneBox('upcoming')}
  </section>`;
}

// 事業を横に並べ、その下に担当している業務（スプシの「業務」タブ）。タップで、その事業で動いているプロジェクトを見る
function bizList(){
  const ps = state.projects || [], ws = state.works || [];
  const list = BIZ.filter(b => ws.some(w => w['事業'] === b.name) || ps.some(p => p['事業'] === b.name));
  if (ps.some(p => bizOrder(p['事業']) === 99)) list.push({name:'事業未設定', v:'--b-self'});
  return list;
}
function worksHtml(){
  const ws = state.works || [], ps = state.projects || [], today = state.today;
  const cols = bizList();
  if (!cols.length) return '';
  return `<section class="works-sec">
    <h2>事業 <span class="n">タップで動いているプロジェクト</span></h2>
    <div class="works">${cols.map(b => {
      const items = ws.filter(w => w['事業'] === b.name);
      const pj = ps.filter(p => b.name === '事業未設定' ? bizOrder(p['事業']) === 99 : p['事業'] === b.name);
      const over = pj.some(p => p['期限'] && p['期限'] < today);
      return `<button class="wcard" data-act="bizview" data-biz="${esc(b.name)}" style="--c:var(${b.v})">
        <h3>${esc(b.name)}</h3>
        <ul>${items.map(w => `<li>${esc(w['業務'])}</li>`).join('')}</ul>
        <div class="wfoot ${over?'due-over':''}">プロジェクト ${pj.length}件${over?'・期限切れあり':''}</div>
      </button>`;
    }).join('')}</div>
  </section>`;
}

function goalsHtml(){
  const gs = state.goals || [];
  const block = (kind) => {
    const list = gs.filter(g => g['種類'] === kind)
      .sort((a,b) => bizOrder(a['事業']) - bizOrder(b['事業']));
    return `<div class="goal-block"><h3>${kind === '自分' ? '自分の目標' : '事業の目標'}</h3>
      ${list.length ? list.map(g => `<div class="goal"${g['事業'] ? ` style="--c:var(${bizVar(g['事業'])})"` : ''}>

const allTasks = () => [...state.tasks, ...state.carry, ...(state.upcoming||[]), ...(state.waiting||[]), ...(state.someday||[]), ...(state.projTasks||[]), ...(state.calTasks||[]), ...(state.recentDone||[])];

async function act(fnLocal, call, okMsg){

  catch(e){ state = backup; render(); toast('保存できませんでした：' + (e.message || e)); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act){
    case 'toggle': {
      const t = findTask(id); if (!t) return;
      const prev = t['状態'], completing = prev !== '済', next = completing ? '済' : '未';
      const run = () => act(() => { allTasks().filter(x => x.ID === id).forEach(x => { x['状態'] = next; x['完了日時'] = completing ? nowStr() : ''; }); },
        () => api('status', {id, status: next}));
      const el = b.closest('.item, .cal-task');
      // 完了にしたものは、すっと消えてから一覧を組み直す。しばらく「元に戻す」を出す
      if (completing && el && !el.closest('dialog')){ el.classList.add('leaving'); setTimeout(run, 210); }
      else run();
      if (completing) showUndo(id, prev);
      break;
    }
    case 'keep': {
      act(() => {
        const t = state.carry.find(x => x.ID === id);
        state.carry = state.carry.filter(x => x.ID !== id);
        t['日付'] = state.today; t['状態'] = '未'; state.tasks.push(t);
      }, () => api('keep', {id}), '今日に移しました');
      break;
    }
    case 'drop': {
      act(() => { state.carry = state.carry.filter(x => x.ID !== id); },
        () => api('status', {id, status:'捨'}), 'やめにしました');
      break;
    }
    case 'edit': { const t = findTask(id); if (t) openTask({mode:'edit', task:t}); break; }
    case 'bizview': openBiz(b.dataset.biz); break;
    case 'pedit': { const pr = (state.projects || []).find(x => x.ID === id); if (pr) openProj(pr); break; }
    case 'calday': calSel = b.dataset.day; $('#cal').outerHTML = upcomingHtml(); break;
    case 'cand-take': {
      const c = (state.candidates || []).find(x => x['行ID'] === id); if (!c) return;
      openTask({mode:'cand', task:{'内容': String(c['原文']).replace(/^\[[^\]]*\]\s*/, ''), '日付': state.today}, inboxId:id});
      break;
    }
    case 'cand-drop': {
      act(() => { state.candidates = state.candidates.filter(x => x['行ID'] !== id); },
        () => api('cand', {rowId:id}), '不要にしました');
      break;
    }
    case 'reload': refreshSite(); break;
    case 'month': openMonth(); break;
    case 'mday': mSel = b.dataset.day; fillMonth(); break;
    case 'madd': openTask({mode:'add', task:{'日付': b.dataset.day}}); break;
    case 'settings': openSettings(); break;
  }
});

// スマホ：いちばん上で下に引くと更新
(function(){
  const ind = $('#ptr'); let y0 = 0, dy = 0, on = false;
  const reset = () => { on = false; dy = 0; ind.style.opacity = 0; ind.classList.remove('ready'); ind.textContent = '↓ 引いて更新'; };
  addEventListener('touchstart', e => {
    if (window.scrollY > 0 || document.querySelector('dialog[open]') || e.touches.length !== 1) return;
    on = true; y0 = e.touches[0].clientY; dy = 0;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (!on) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0){ ind.style.opacity = 0; return; }
    ind.style.opacity = Math.min(dy / 60, 1);
    const ready = dy > 70;
    ind.classList.toggle('ready', ready);
    ind.textContent = ready ? '離して更新' : '↓ 引いて更新';
  }, {passive:true});
  addEventListener('touchend', () => { const go = on && dy > 70; reset(); if (go) refreshSite(); });
  addEventListener('touchcancel', reset);
})();

/* ---------- 月カレンダー（前後の月へ送って、全部の月のタスクと予定を簡易表示） ---------- */
let mYM = '', mSel = '';
const evCache = {};
const ymOf = ymd => String(ymd).slice(0, 7);
function openMonth(){
  mYM = ymOf(state.today); mSel = state.today;
  fillMonth();
  $('#monthDlg').showModal();
}
function shiftMonth(n){
  const d = new Date(mYM + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n);
  mYM = d.toISOString().slice(0, 7); mSel = ''; fillMonth();
}
function evListHtml(evs){
  if (!evs.length) return '';
  return `<div class="list ev-list">${evs.map(e => `<div class="item ev">
    <div class="ev-time">${e.start ? esc(e.start) : '終日'}</div>
    <div class="body"><div class="title">${esc(e.title)}</div>${e.start && e.end ? `<div class="meta">〜${esc(e.end)}</div>` : ''}</div>
  </div>`).join('')}</div>`;
}
function fillMonth(){
  const first = mYM + '-01';
  const start = addDays(first, -new Date(first + 'T00:00:00Z').getUTCDay());
  const end = addDays(start, 42);
  const key = start + '_' + end;
  if (!evCache[key]){
    evCache[key] = 'loading';
    const done = r => { evCache[key] = r; if ($('#monthDlg').open) fillMonth(); };
    api('events', {from:start, to:end}).then(done).catch(() => done([]));
  }
  const evs = Array.isArray(evCache[key]) ? evCache[key] : [];
  const byDay = {};
  (state.calTasks || []).forEach(t => { (byDay[t['日付']] = byDay[t['日付']] || []).push(t); });
  const sortT = a => a.slice().sort((x, y) => (x['状態']==='済') - (y['状態']==='済') || bizOrder(x['事業']) - bizOrder(y['事業']));
  const cells = [];
  for (let i = 0; i < 42; i++){
    const day = addDays(start, i), wd = i % 7;
    const ts = sortT(byDay[day] || []), es = evs.filter(e => e.date === day);
    const dots = es.map(() => '<i class="dot ev"></i>').join('')
      + ts.slice(0, 8).map(t => `<i class="dot" style="--c:var(${bizVar(t['事業'])})"></i>`).join('');
    cells.push(`<div class="m-cell ${ymOf(day) !== mYM ? 'dim' : ''} ${day === state.today ? 'today' : ''} ${day === mSel ? 'sel' : ''} ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}" data-act="mday" data-day="${day}">
      <div class="m-d">${+day.slice(8)}</div>
      <div class="m-full">
        ${es.slice(0, 2).map(e => `<div class="m-ev">${esc(e.title)}</div>`).join('')}
        ${ts.slice(0, 3).map(t => `<div class="m-t ${t['状態']==='済' ? 'is-done' : ''}" style="--c:var(${bizVar(t['事業'])})">${esc(short(t['内容'], 10))}</div>`).join('')}
        ${ts.length > 3 ? `<div class="m-more">ほか${ts.length - 3}件</div>` : ''}
      </div>
      <div class="m-dots">${dots}</div>
    </div>`);
  }
  $('#mTitle').textContent = `${mYM.slice(0, 4)}年${+mYM.slice(5)}月`;
  $('#mGrid').innerHTML = cells.join('');
  const dts = mSel ? sortT(byDay[mSel] || []) : [], des = mSel ? evs.filter(e => e.date === mSel) : [];
  $('#mDetail').innerHTML = mSel ? `
    <div class="day-head">${esc(md(mSel))}</div>
    ${evListHtml(des)}
    ${dts.length ? `<div class="list">${dts.map(t => taskItem(t)).join('')}</div>`
      : (des.length ? '' : '<p class="empty-note">この日のタスクと予定はありません。</p>')}
    <div class="row-btns" style="margin-top:10px"><button class="btn sec" data-act="madd" data-day="${mSel}">＋ この日にタスクを足す</button></div>` : '';
}

  const ymd = dt => new Date(dt.getTime() + 9*3600e3).toISOString().slice(0,10);
  const today = ymd(new Date()), day = n => addDays(today, n);
  if (!demo) demo = {
    tasks:[
      {ID:'T1','日付':today,'内容':'週末イベントのスタッフ名簿を送る','事業':'ギガネット（通信）','状態':'未','メモ':'','期限':'','見込み分':'15'},
      {ID:'T2','日付':today,'内容':'交通費申請の未提出者にリマインド','事業':'ギガネット（通信）','状態':'済','メモ':''},
      {ID:'T3','日付':today,'内容':'新商品の箱 修正版を確認に出す','事業':'円山製麺','状態':'未','メモ':'','プロジェクトID':'P3'},
      {ID:'T5','日付':today,'内容':'メニューPOPの英語表記を確認','事業':'SHEEP GANG','状態':'未','メモ':''},
      {ID:'T0','日付':day(-1),'内容':'インスタ ストーリー投稿','事業':'円山製麺','状態':'未','メモ':''},
      {ID:'T7','日付':day(2),'内容':'売り場の全体デザイン提案','事業':'円山製麺','状態':'未','メモ':'','プロジェクトID':'P3','期限':day(2)},
      {ID:'T8','日付':day(5),'内容':'月初の交通費回収','事業':'エルダイブ','状態':'未','メモ':''},
      {ID:'T9','日付':day(1),'内容':'契約書の返送','事業':'ギガネット（通信）','状態':'待ち','メモ':'先方の確認待ち','期限':day(4)},
      {ID:'T10','日付':'','内容':'経費精算','事業':'エルダイブ','状態':'保留','メモ':'月末にまとめる'},
    ],
    events:[
      {date:today, start:'10:00', end:'18:00', title:'事務所'},
      {date:day(2), start:'', end:'', title:'直売事務所'},
      {date:day(4), start:'09:30', end:'17:00', title:'イベント会場'},
    ],
    works:[
      {ID:'W1','事業':'ギガネット（通信）','業務':'ポスター作製','順番':'1'},
      {ID:'W2','事業':'ギガネット（通信）','業務':'勤怠管理','順番':'2'},
      {ID:'W3','事業':'円山製麺','業務':'物産展企画','順番':'1'},
      {ID:'W4','事業':'円山製麺','業務':'直売所','順番':'2'},
      {ID:'W5','事業':'SHEEP GANG','業務':'印刷物','順番':'1'},
      {ID:'W6','事業':'SHEEP GANG','業務':'名刺','順番':'2'},
      {ID:'W7','事業':'SHEEP GANG','業務':'ポスター','順番':'3'},
      {ID:'W8','事業':'エルダイブ','業務':'ユナイト管理','順番':'1'},
    ],
    recur:[
      {ID:'R1','名前':'スタッフ交通費回収','事業':'エルダイブ','周期':'毎月','開始日':'1','期限日':'1','見込み分':'30','手順':'','有効':'TRUE','メモ':''},
      {ID:'R2','名前':'直売前の印刷業務','事業':'円山製麺','周期':'直売日前日','開始日':'','期限日':'','見込み分':'','手順':'賞味期限ラベル確認・印刷\nちらし印刷','有効':'TRUE','メモ':''},
    ],
    inbox:[{'行ID':'L1','日時':today+' 09:00','原文':'[Todoist] チラシを作るか検討','仕分け先':'候補（未確認）'}],
    projects:[
      {ID:'P1','名前':'ショッピングモール催事','事業':'ギガネット（通信）','状態':'進行中','次の一手':'駐車場の台数を確定','期限':day(12)},
      {ID:'P3','名前':'新商品パッケージ','事業':'円山製麺','状態':'進行中','次の一手':'箱の入稿データ作成','期限':day(-1)},
      {ID:'P5','名前':'社内ToDoアプリ','事業':'エルダイブ','状態':'待ち','次の一手':'3人で公開範囲を決める','期限':''},
    ],
    goals:[
      {ID:'G1','種類':'自分','期間':'月','内容':'週報を記録から自動で作れる状態にする','指標':'週報作成 1時間以内','現状':'ボード運用開始'},
      {ID:'G2','種類':'事業','期間':'週','内容':'店舗 1週間の売上目標を達成','指標':'週の売上','現状':'','事業':'円山製麺'},
    ],
    decisions:[
      {'日時':today+' 11:20','プロジェクトID':'P3','プロジェクト名':'新商品パッケージ','内容':'説明書は箱と別紙にする','状態':'確定','理由・却下案':'箱に印刷すると修正のたびに版代がかかる。却下案：箱の内側に印刷','チャットURL':'https://claude.ai/'},
    ],
  };
  const T = demo.tasks, find = id => T.find(x => x.ID === id);
  const open = s => s === '未' || s === '' || s === '繰越', wait = s => s === '待ち' || s === '保留';
  return new Promise(r => setTimeout(r, 150)).then(() => {
    if (action === 'data'){
      const in7 = day(7);
      return JSON.parse(JSON.stringify({
        today,
        tasks: T.filter(t => t['日付'] === today && t['状態'] !== '捨' && !wait(t['状態'])),
        carry: T.filter(t => t['日付'] && t['日付'] < today && open(t['状態'])),
        upcoming: T.filter(t => t['日付'] > today && t['日付'] <= in7 && (open(t['状態']) || wait(t['状態']))).sort((a,b) => a['日付'] < b['日付'] ? -1 : 1),
        waiting: T.filter(t => wait(t['状態'])),
        someday: T.filter(t => !t['日付'] && open(t['状態'])),
        projTasks: T.filter(t => t['プロジェクトID'] && t['状態'] !== '捨'),
        projects: demo.projects.filter(x => x['状態'] !== '完了'),
        goals: demo.goals, decisions: demo.decisions,
        candidates: demo.inbox.filter(x => x['仕分け先'] === '候補（未確認）'),
        events: demo.events,
        works: demo.works,
        calTasks: T.filter(t => t['日付'] && t['状態'] !== '捨'),
        recentDone: T.filter(t => t['状態'] === '済').map(t => ({...t, '完了日時': t['完了日時'] || (today + ' 09:30')})),
        fetchedAt: today + ' ' + new Date().toTimeString().slice(0,5)
      }));
    }
    if (action === 'status'){ const t = find(p.id); if (t) t['状態'] = p.status; return {}; }
    if (action === 'keep'){ const t = find(p.id); if (t){ t['日付'] = today; t['状態'] = '未'; } return {}; }
    if (action === 'add'){
      const id = 'T' + Date.now(); const f = p.fields || {'内容':p.text,'事業':p.biz};
      T.push({ID:id, '日付': '日付' in f ? f['日付'] : today, '状態':'未', 'メモ':'', ...f});
      if (p.inboxId){ const c = demo.inbox.find(x => x['行ID'] === p.inboxId); if (c){ c['仕分け先'] = 'タスク追加'; c['反映先ID'] = id; } }
      return {id};
    }
    if (action === 'update'){ Object.assign(find(p.id), p.fields); return {}; }
    if (action === 'padd'){ const id = 'P' + Date.now(); demo.projects.push({ID:id, ...p.fields}); return {id}; }
    if (action === 'pupdate'){ Object.assign(demo.projects.find(x => x.ID === p.id), p.fields); return {}; }
    if (action === 'recur') return JSON.parse(JSON.stringify(demo.recur));
    if (action === 'events') return JSON.parse(JSON.stringify(demo.events.filter(e => e.date >= p.from && e.date < p.to)));
    if (action === 'rupdate'){ Object.assign(demo.recur.find(x => x.ID === p.id), p.fields); return {}; }
    if (action === 'cand'){ const c = demo.inbox.find(x => x['行ID'] === p.rowId); if (c) c['仕分け先'] = '候補（不要）'; return {}; }
  });
}

/* 起動 */
render();
if (cfg.url) load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
